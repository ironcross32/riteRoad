name: Release

# Pushing a tag such as v0.1.0 builds, signs and publishes that release, which the updater offers.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Runs before the builds, so a mistagged release, or one without notes, fails in seconds.
      - name: Check the tag matches Cargo.toml
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          if [ "$version" != "$crate" ]; then
            echo "::error file=Cargo.toml::The tag is $GITHUB_REF_NAME but Cargo.toml says $crate."
            exit 1
          fi
      - name: Read this version's changelog
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v heading="## $version" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md | sed '/./,$!d')
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error file=CHANGELOG.md::No changelog for $version. Add a '## $version' section before tagging."
            exit 1
          fi
          {
            echo 'body<<END_OF_NOTES'
            printf '%s\n' "$notes"
            echo 'END_OF_NOTES'
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: notes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # The x64 runner has CMake, and the MSVC step puts Visual Studio's Ninja on the PATH.
      - name: Install CMake and Ninja
        if: matrix.arch == 'arm64'
        uses: lukka/get-cmake@v4.5.1
      # wxWidgets is built by wxdragon-sys, so only its locked version decides whether a cached build still fits.
      - name: Find the locked wxdragon-sys
        id: wxdragon
        shell: bash
        run: echo "hash=$(awk '/^name = "wxdragon-sys"/{f=1} f&&/^$/{exit} f' Cargo.lock | grep -E '^(version|source|checksum) ' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache wxWidgets source
        uses: actions/cache@v6
        with:
          path: wxWidgets
          key: wxwidgets-src-${{ steps.wxdragon.outputs.hash }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-${{ matrix.arch }}-wx-${{ steps.wxdragon.outputs.hash }}-msvc${{ env.VCToolsVersion }}
      # Without the minisign secrets the build fails here rather than publishing a release the updater won't install.
      - name: Check the signing key is set
        shell: bash
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "::error::The MINISIGN_KEY secret isn't set, so the release couldn't be signed."
            exit 1
          fi
      - name: Build, package and sign
        env:
          WXWIDGETS_DIR: ${{ github.workspace }}/wxWidgets
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: cargo xtask release
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: riteroad-${{ matrix.arch }}
          path: |
            target/release/riteroad-${{ matrix.arch }}.zip
            target/release/riteroad-${{ matrix.arch }}.zip.minisig
          if-no-files-found: error

  publish:
    name: Publish
    needs: [notes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: riteroad-*
          path: dist
          merge-multiple: true
      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: riteRoad ${{ github.ref_name }}
          body: ${{ needs.notes.outputs.body }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
